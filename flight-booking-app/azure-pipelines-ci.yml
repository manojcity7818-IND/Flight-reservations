trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - flight-booking-app/**

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: "3.12"
  nodeVersion: "22.x"
  workingDir: flight-booking-app

stages:
  - stage: CI
    displayName: Flight Booking CI
    jobs:
      - job: TestAndBuild
        displayName: Test, lint, and build
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"

          - task: NodeTool@0
            inputs:
              versionSpec: "$(nodeVersion)"

          - script: |
              python -m pip install --upgrade pip
              pip install -r services/flight-search-service/requirements.txt
              pip install -r services/booking-service/requirements.txt
              pip install -r services/payment-service/requirements.txt
              pip install -r services/notification-service/requirements.txt
              pip install -r services/user-service/requirements.txt
              pip install -r services/api-gateway/requirements.txt
              pip install pytest ruff
            workingDirectory: $(workingDir)
            displayName: Install Python dependencies

          - script: |
              ruff check services tests web/tests
            workingDirectory: $(workingDir)
            displayName: Lint Python
            continueOnError: false

          - script: |
              set -e
              for service in flight-search-service booking-service payment-service notification-service user-service api-gateway; do
                echo "Testing $service"
                (cd services/$service && python -m pytest)
              done
              python -m pytest tests/integration
              (cd web && python -m pytest)
            workingDirectory: $(workingDir)
            displayName: Run unit and integration tests

          - script: |
              npm install
              npm run lint
              npm test
              npm run build
            workingDirectory: $(workingDir)/web
            displayName: Build and test frontend

          - script: |
              docker build -t flight-search-service:ci ./services/flight-search-service
              docker build -t booking-service:ci ./services/booking-service
              docker build -t payment-service:ci ./services/payment-service
              docker build -t notification-service:ci ./services/notification-service
              docker build -t user-service:ci ./services/user-service
              docker build -t api-gateway:ci ./services/api-gateway
              docker build -t flight-frontend:ci ./web
            workingDirectory: $(workingDir)
            displayName: Build Docker images
            # Images are built locally for validation only. Do not push to ACR from CI.
